name: truth_mouth
description: "진실의 입 - AI 광고 필터링 맛집 리뷰 앱"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  riverpod: ^2.6.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.2
  dio: ^5.7.0
  geolocator: ^13.0.2
  flutter_naver_map: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
