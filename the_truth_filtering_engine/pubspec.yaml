name: truth_mouth
description: "진실의 입 - AI 광고 필터링 맛집 리뷰 앱"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Network & Data
  http: ^1.2.2
  dio: ^5.7.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  
  # UI Components
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1
  
  # State Management (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Location & Maps
  geolocator: ^13.0.2
  flutter_naver_map: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/images/categories/
    - assets/images/thumbnails/
